const show=n=>{for(let k=0;k<n;k++)setTimeout(()=>boom(fc.width*(.15+Math.random()*.7),fc.height*(.15+Math.random()*.4)),k*300)};

/* petals + tap sparkles */
setInterval(()=>{const s=document.createElement('span');s.textContent=rnd(['🌸','💗','✨','🦋','💖','🌷','⭐']);s.style.left=Math.random()*100+'vw';s.style.fontSize=12+Math.random()*18+'px';s.style.animationDuration=8+Math.random()*7+'s';$('#fl').appendChild(s);setTimeout(()=>s.remove(),15000)},900);
addEventListener('pointerdown',e=>{for(let k=0;k<6;k++){const s=document.createElement('span');s.className='sp';s.textContent=rnd(['💗','✨','💖','🌸']);s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
 s.style.setProperty('--dx',(Math.random()*80-40)+'px');s.style.setProperty('--dy',(Math.random()*-90-10)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}});

/* music */
const au=C.music?new Audio(C.music):null;let pl=0;if(au)au.loop=true;
const music=o=>{if(!au)return;pl=o;o?au.play().catch(()=>{}):au.pause();$('#snd').textContent=o?'🔊':'🔇'};$('#snd').onclick=()=>music(!pl);

/* core */
const nx=$('#nx');
function lock(){if(seen.has(i)){unlock();return}nx.disabled=true;clearTimeout(fb);fb=setTimeout(unlock,35000)}
function unlock(){seen.add(i);nx.disabled=false;clearTimeout(fb)}
function ty(el,x,cb){el._x=x;el._cb=cb;el.textContent='';el.classList.add('cur');TY.add(el);let n=0;el._t=setInterval(()=>fin_(el,n=n+1>x.length?x.length:n+1),26)}
function fin_(el,n){el.textContent=el._x.slice(0,n);if(n>=el._x.length)endTy(el)}
function endTy(el){clearInterval(el._t);el.textContent=el._x;el.classList.remove('cur');TY.delete(el);el._cb&&el._cb()}
$('#stage').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;[...TY].forEach(endTy)});
const H=(e,h,p)=>`<div class="em">${e}</div><h2>${h}</h2><p class="ty"></p>`;
const typeP=(b,x,fn)=>ty(q('p.ty',b),x,fn||unlock);

function theme(){let t='pink',cl='';for(let k=0;k<=i;k++)if(S[k][0]=='ch'){t=S[k][4];cl=S[k][2]}document.body.className=t;$('#cl').textContent=cl}
function render(){const s=S[i],b=document.createElement('div');b.className='sl';$('#sl').innerHTML='';$('#sl').appendChild(b);TY.clear();theme();
 $('#cn').textContent=`${i+1} / ${S.length}`;$('#pb>i').style.width=(i+1)/S.length*100+'%';$('#bk').style.visibility=i?'visible':'hidden';nx.style.display=s[0]=='end'?'none':'block';
 nx.disabled=true;R[s[0]](b,s);scrollTo(0,0)}
const nxt=()=>{if(i<S.length-1){i++;render()}},prv=()=>{if(i>0){i--;render()}};
nx.onclick=nxt;$('#bk').onclick=prv;
let tx=0;$('#stage').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#stage').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(d<-70&&!nx.disabled)nxt();if(d>70)prv()},{passive:true});
$('#enter').onclick=()=>{$('#gate').classList.add('off');$('#ui').style.display='block';music(1);render();confetti()};

/* menu / exit */
$('#mn').onclick=()=>{$('#ml').innerHTML=S.map((s,j)=>s[0]=='ch'?`<button class="mi" data-j="${j}">${s[3]} ${s[2]}<small>${s[1]}</small></button>`:'').join('');
 qa('.mi').forEach(m=>m.onclick=()=>{i=+m.dataset.j;$('#menu').classList.remove('on');render()});$('#menu').classList.add('on')};
$('#mc').onclick=()=>$('#menu').classList.remove('on');
$('#xb').onclick=()=>$('#ex').classList.add('on');$('#stay').onclick=()=>$('#ex').classList.remove('on');
$('#leave').onclick=()=>{$('#ex').classList.remove('on');music(0);$('#bye').classList.add('on');try{window.close()}catch(e){}};
$('#back').onclick=()=>{$('#bye').classList.remove('on');music(1)};

/* ---- slide types ---- */
R.ch=(b,s)=>{b.innerHTML=`<span class="chn">${s[1]}</span><div class="em">${s[3]}</div><h2 style="font-size:50px">${s[2]}</h2>`;confetti();lock();setTimeout(unlock,1800)};
R.t=(b,s)=>{b.innerHTML=H(s[1],s[2]);lock();typeP(b,s[3])};
R.B=(b,s)=>{b.innerHTML=`<div class="ted">${C.teddyImg?`<img src="${C.teddyImg}">`:'🧸'}</div><div class="bub"><p class="ty"></p></div>`;lock();typeP(b,s[1])};
R.ph=(b,s)=>{const p=C.photos[s[1]]||['','',''];b.innerHTML=`<div class="pol"><div><img src="${p[0]}" onerror="this.parentNode.textContent='💞'"></div><span class="hand">${p[1]}</span></div><p class="ty"></p>`;lock();typeP(b,p[2])};
R.cake=b=>{b.innerHTML=`<h2>Make a wish ✨</h2><p class="sm">Tap each candle to blow it out</p><div class="cake"><div class="cs"><b class="can"><i></i></b><b class="can"><i></i></b><b class="can"><i></i></b></div><div class="t1"></div><div class="t2"></div><div class="pl"></div></div><h2 id="cw"></h2>`;lock();let o=0;
 qa('.can',b).forEach(c=>c.onclick=()=>{if(c.classList.contains('out'))return;c.classList.add('out');if(++o==3){confetti();show(4);q('#cw',b).textContent=`Happy Birthday, ${her}! 🎉`;unlock()}})};
R.balloon=b=>{b.innerHTML=`<h2>Pop the balloons 🎈</h2><p class="sm">Pop all 6 for a surprise! <b id="bc">0</b>/6</p><div class="ar" id="ar"></div>`;lock();const ar=q('#ar',b);let n=0;
 const hu=[0,60,120,200,280,320];hu.forEach((h,k)=>{const s=document.createElement('span');s.className='bl';s.textContent='🎈';s.style.filter=`hue-rotate(${h}deg)`;s.style.left=10+k%3*30+Math.random()*6+'%';s.style.top=12+(k/3|0)*46+'%';s.style.setProperty('--dx',Math.random()*30-15+'px');s.style.animationDelay=Math.random()*2+'s';
  s.onpointerdown=()=>{if(s.classList.contains('pop'))return;s.classList.add('pop');q('#bc',b).textContent=++n;if(n==6){confetti();ar.innerHTML=`<div style="padding-top:100px"><div style="font-size:60px">🎉</div><h2>Surprise! You are loved! 💖</h2></div>`;unlock()}};ar.appendChild(s)})};
R.rev=b=>{b.innerHTML=`<div class="em">🎁</div><h2>My birthday wishes for you</h2><p class="sm">Tap each gift to open</p><div class="rv">${C.wishes.map(()=>`<button>🎁 Tap to open</button>`).join('')}</div>`;lock();let n=0;
 qa('.rv button',b).forEach((x,k)=>x.onclick=()=>{if(x.classList.contains('o'))return;x.classList.add('o');x.textContent=C.wishes[k];if(++n==C.wishes.length){confetti();unlock()}})};
R.bars=b=>{const it=[["Beauty 😍",100],["Kindness 🌷",100],["Cuteness 🧸","∞"],["Hug Power 🤗",100],["Making me smile 😊",100]];
 b.innerHTML=`<div class="em">👑</div><h2>Princess Report Card</h2><p class="sm">Officially graded by ${me}</p><div class="card" style="margin-top:14px">${it.map(x=>`<div class="br">${x[0]} <span style="float:right">${x[1]}${x[1]=='∞'?'':'%'}</span><i><b></b></i></div>`).join('')}</div>`;lock();
 qa('.br b',b).forEach((x,k)=>setTimeout(()=>x.style.width='100%',300+k*500));setTimeout(()=>{confetti();unlock()},3200)};
R.mirror=b=>{b.innerHTML=`<h2>Magic Mirror 🪞</h2><p class="sm">Tap the mirror and ask:<br>"Who is the fairest of them all?"</p><div class="mir">🪞</div><p class="ty hand" style="font-size:30px;color:var(--ac)"></p>`;lock();
 q('.mir',b).onclick=function(){if(this.d)return;this.d=1;this.textContent='✨';show(3);ty(q('p.ty',b),`The fairest in all the land… is Princess ${her}! 👸✨`,unlock)}};
R.pick=b=>{b.innerHTML=`<h2>Pick a heart 💝</h2><p class="sm">Each one hides a secret message</p><div style="margin:20px 0"><button class="hr">💗</button><button class="hr">💖</button><button class="hr">💝</button></div><div class="card" style="display:none"><p class="ty"></p></div>`;lock();let d=0;
 qa('.hr',b).forEach((h,k)=>h.onclick=()=>{if(d)return;d=1;qa('.hr',b).forEach(x=>x!=h&&x.classList.add('x'));const c=q('.card',b);c.style.display='block';confetti();ty(q('p.ty',c),C.pick[k],unlock)})};
R.q=(b,s)=>{b.innerHTML=`<div class="em" style="font-size:56px">🧠</div><p class="sm">Question ${s[4]} of 5</p><h2 style="font-size:32px">${s[1]}</h2>${s[2].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}<p class="fb"></p>`;lock();
 const bad=["Hmm… sleeping on the couch tonight 😤","Did you even listen? 🙄","Aww, try again, my love 💕","Wrong! But still cute 😂"];
 qa('.opt',b).forEach(o=>o.onclick=()=>{if(+o.dataset.k==s[3]){o.classList.add('ok');q('.fb',b).textContent='Yesss! 💖';confetti();qa('.opt',b).forEach(x=>x.style.pointerEvents='none');unlock()}else{o.classList.add('no');o.style.pointerEvents='none';q('.fb',b).textContent=rnd(bad)}})};
R.match=b=>{const em=['💖','🧸','🌹','👑','🦋','🍰'];b.innerHTML=`<h2>Love Match 🃏</h2><p class="sm">Find all the pairs · Moves: <b id="mv">0</b></p><div class="grid">${sh([...em,...em]).map(e=>`<div class="cd" data-e="${e}"><div><b>💗</b><b>${e}</b></div></div>`).join('')}</div>`;lock();let a=null,L=0,mv=0,ok=0;
 qa('.cd',b).forEach(c=>c.onclick=()=>{if(L||c.classList.contains('f'))return;c.classList.add('f');if(!a){a=c;return}q('#mv',b).textContent=++mv;
  if(a.dataset.e==c.dataset.e){a.classList.add('m');c.classList.add('m');a=null;if(++ok==6){confetti();unlock()}}else{L=1;const p=a;a=null;setTimeout(()=>{p.classList.remove('f');c.classList.remove('f');L=0},700)}})};
R.catch=b=>{b.innerHTML=`<h2>Catch my heart 💘</h2><p class="sm">20 seconds · tap 💗💖💘 · dodge 💔</p><div><span class="big" id="cs">0</span> <span class="sm">⏱ <b id="ct">20</b>s</span></div><div class="ar" id="ar"></div><button class="btn" id="go">Start!</button>`;lock();
 q('#go',b).onclick=function(){this.style.display='none';let sc=0,t=20,ar=q('#ar',b);const ci=setInterval(()=>{const s=document.createElement('span'),bd=Math.random()<.22;s.className='fall';s.textContent=bd?'💔':rnd(['💗','💖','💘']);s.style.left=Math.random()*(ar.clientWidth-44)+'px';s.style.animationDuration=2.3+Math.random()*1.3+'s';
  s.onpointerdown=()=>{if(s.classList.contains('pop'))return;sc=Math.max(0,sc+(bd?-3:1));q('#cs',b).textContent=sc;s.classList.add('pop');setTimeout(()=>s.remove(),300)};s.onanimationend=()=>s.remove();ar.appendChild(s)},420);
  const ti=setInterval(()=>{q('#ct',b).textContent=--t;if(t<=0){clearInterval(ci);clearInterval(ti);ar.innerHTML=`<div style="padding-top:90px"><div class="big">${sc} 💗</div><h2>${sc>=15?"You caught my whole heart!":"You already own my heart anyway 😘"}</h2></div>`;if(sc>=15)confetti();unlock()}},1000)}};
R.w=(b,s)=>{b.innerHTML=`<div class="em" style="font-size:60px">🤔</div><h2>${s[1]}</h2><button class="opt">${s[2]}</button><button class="opt">${s[3]}</button><p class="fb"></p>`;lock();
 qa('.opt',b).forEach(o=>o.onclick=()=>{qa('.opt',b).forEach(x=>x.style.pointerEvents='none');o.classList.add('ok');q('.fb',b).textContent=rnd(["Same! We're perfect together 😍","Great choice, let's do it soon 💕","Good thing I love both with you 🥰"]);confetti();unlock()})};
R.wheel=b=>{b.innerHTML=`<div class="em">🎡</div><h2>Spin the Love Wheel</h2><p class="sm">Your boyfriend must obey whatever it says…</p><div class="card" style="margin:16px 0;min-height:100px;display:flex;align-items:center;justify-content:center"><p id="wv" style="font-weight:700">? ? ?</p></div><button class="btn" id="sp">Spin 🎲</button>`;lock();
 q('#sp',b).onclick=function(){this.disabled=true;let n=0;const t=setInterval(()=>{q('#wv',b).textContent=rnd(C.dares);if(++n>14){clearInterval(t);confetti();unlock();this.disabled=false;this.textContent='Spin again 🎲'}},130)}};
R.fire=b=>{b.innerHTML=`<h2>Enchanted Garden 🧚‍♀️</h2><p class="sm">Catch all 7 fireflies · <b id="fc">0</b>/7</p><div class="ar dk" id="ar"></div>`;lock();let n=0;
 for(let k=0;k<7;k++){const s=document.createElement('span');s.className='ff';s.textContent='✨';s.style.left=8+Math.random()*80+'%';s.style.top=8+Math.random()*78+'%';s.style.setProperty('--dx',Math.random()*100-50+'px');s.style.setProperty('--dy',Math.random()*100-50+'px');s.style.animationDelay=-Math.random()*4+'s';
  s.onpointerdown=()=>{if(s.classList.contains('pop'))return;s.classList.add('pop');q('#fc',b).textContent=++n;if(n==7){show(4);q('#ar',b).innerHTML='<div style="padding-top:110px;color:#fff"><div style="font-size:60px">🧚‍♀️</div><h2 style="color:#ffe29a">The fairies love you!</h2></div>';unlock()}};q('#ar',b).appendChild(s)}};
R.crown=b=>{b.innerHTML=`<h2>Crown Ceremony 👑</h2><p class="sm">Tap the crown to crown the princess</p><div style="position:relative;height:220px"><div class="em" style="font-size:120px;position:absolute;left:0;right:0;top:70px">👸</div><div class="em" id="cr" style="font-size:90px;position:absolute;left:0;right:0;top:0;cursor:pointer;transition:top 1s">👑</div></div><h2 id="cw"></h2>`;lock();
 q('#cr',b).onclick=function(){this.style.top='22px';this.style.animation='none';show(5);confetti();q('#cw',b).textContent=`Long live Princess ${her}!`;unlock()}};
R.decree=b=>{b.innerHTML=`<div class="em">📜</div><div class="scr"><p class="ty" style="white-space:pre-wrap"></p></div>`;lock();typeP(b,C.decree)};
R.cp=b=>{b.innerHTML=`<h2>Love Coupons 🎟️</h2><p class="sm">Tap to reveal · valid forever</p><div class="grid" style="grid-template-columns:1fr 1fr">${C.coupons.map(c=>`<button class="cp"><span>🎟️</span>Tap me</button>`).join('')}</div>`;lock();let n=0;
 qa('.cp',b).forEach((x,k)=>x.onclick=()=>{if(x.classList.contains('o'))return;x.classList.add('o');x.innerHTML=`<span>${C.coupons[k][0]}</span>${C.coupons[k][1]}`;if(++n==3){confetti();unlock()}})};
R.letter=b=>{b.innerHTML=`<div class="em">💌</div><h2>A letter for you</h2><div class="card"><div class="lt ty"></div></div><p class="sm" style="margin-top:8px">(tap to skip typing)</p>`;lock();const e=q('.lt',b);ty(e,C.letter,unlock)};
R.wish=b=>{b.innerHTML=`<h2>Make a wish 🌠</h2><p class="sm">Close your eyes, think of your biggest wish, then tap the star</p><button class="star" id="st">🌟</button><p class="ty hand" style="font-size:28px;color:var(--ac)"></p>`;lock();
 q('#st',b).onclick=function(){show(8);confetti();if(!this.d){this.d=1;ty(q('p.ty',b),"Whatever you wished… I'll try to make it come true 💫",unlock)}}};
R.fin=b=>{b.innerHTML=`<div class="em">❤️</div><h2 style="font-size:46px">Happy Birthday, ${her}</h2><div class="card" style="margin-top:12px"><p class="ty"></p><p class="hand" style="font-size:30px;color:var(--ac);margin-top:10px">— ${me} 💕</p></div>`;show(6);confetti();lock();typeP(b,C.final)};
R.end=b=>{b.innerHTML=`<div class="ted" style="font-size:110px">🧸</div><h2 style="font-size:50px">The End… for now 💕</h2><p>Happy Birthday, my princess.<br>This is only the beginning of our fairy tale.</p>
 <div style="display:grid;gap:10px;margin-top:20px"><button class="btn" id="e1">↻ Replay from the start</button><button class="btn ghost" id="e2">☰ Jump to my favourite part</button><button class="btn ghost" id="e3">✕ Exit</button></div>`;show(6);confetti();
 q('#e1',b).onclick=()=>{i=0;render()};q('#e2',b).onclick=()=>$('#mn').click();q('#e3',b).onclick=()=>$('#leave').click()};
</script></body></html>
